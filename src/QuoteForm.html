<!-- Form for creating a quote document. Included by the sheet dialog and by the web app. -->
<div id="qf">
  <label for="qf-quote">Quote row</label>
  <select id="qf-quote" disabled><option>Loading…</option></select>
  <div class="hint">Add the row in the Quotes tab first. The list shows the latest 30 quotes.</div>

  <div id="qf-preview" style="display:none">
    <div class="summary" id="qf-summary"></div>
    <div id="qf-messages"></div>

    <label for="qf-description">Service description</label>
    <textarea id="qf-description" placeholder="What the quote covers"></textarea>
    <div class="hint">Prefilled with the assignment of the quote. Line breaks are kept.</div>

    <label style="font-weight:normal"><input type="checkbox" id="qf-draft" checked> Create a Gmail draft with the PDF attached</label>
    <label id="qf-ignore-block" style="display:none;font-weight:normal"><input type="checkbox" id="qf-ignore"> Create the quote despite the errors above</label>

    <div class="actions">
      <button class="primary" id="qf-create">Create quote</button>
      <span id="qf-status"></span>
    </div>
  </div>
  <div id="qf-result"></div>
</div>

<script>
  (function () {
    var q = function (id) { return document.getElementById(id); };
    var current = null;

    function esc(s) {
      return String(s).replace(/[&<>"]/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]; });
    }
    function list(items, cls) {
      if (!items.length) return '';
      return '<ul class="msgs">' + items.map(function (m) { return '<li class="' + cls + '">' + esc(m) + '</li>'; }).join('') + '</ul>';
    }
    function fail(err) {
      q('qf-status').textContent = '';
      q('qf-create').disabled = false;
      q('qf-preview').style.display = '';
      q('qf-result').innerHTML = '<div class="result error">' + esc(err.message || err) + '</div>';
    }
    function loadPreview() {
      q('qf-preview').style.display = 'none';
      q('qf-result').innerHTML = '';
      google.script.run.withSuccessHandler(showPreview).withFailureHandler(fail).getQuotePreview(q('qf-quote').value);
    }
    function showPreview(p) {
      current = p;
      q('qf-summary').innerHTML = [
        ['Client', p.client], ['Assignment', p.assignment], ['Issue date', p.issueDate],
        ['Valid until', p.expiryDate], ['Net amount', p.amount], ['Total incl. VAT', p.total]
      ].map(function (r) { return '<div>' + esc(r[0]) + '</div><div>' + esc(r[1]) + '</div>'; }).join('');
      var ok = !p.errors.length && !p.warnings.length ? '<p class="ok">No problems found.</p>' : '';
      q('qf-messages').innerHTML = list(p.errors, 'error') + list(p.warnings, 'warning') + list(p.info, 'info') + ok +
        (p.templateConfigured ? '' : '<p class="error">No quote template is configured yet. See Settings.</p>');
      q('qf-description').value = p.description;
      q('qf-ignore-block').style.display = p.errors.length ? '' : 'none';
      q('qf-ignore').checked = false;
      q('qf-preview').style.display = '';
    }
    function create(allowDuplicate) {
      if (!current) return;
      if (current.errors.length && !q('qf-ignore').checked) {
        fail(new Error('Please fix the errors in the Quotes tab first, or confirm that you want to continue.'));
        return;
      }
      q('qf-create').disabled = true;
      q('qf-status').textContent = 'Creating quote and PDF…';
      q('qf-result').innerHTML = '';
      google.script.run.withSuccessHandler(done).withFailureHandler(fail).submitQuote({
        quoteId: current.id,
        description: q('qf-description').value,
        createDraft: q('qf-draft').checked,
        ignoreErrors: q('qf-ignore').checked,
        allowDuplicate: !!allowDuplicate
      });
    }
    function done(r) {
      q('qf-status').textContent = '';
      q('qf-create').disabled = false;
      if (r.duplicate) {
        q('qf-result').innerHTML = '<div class="result warning">"' + esc(r.name) + '" already exists in the output folder. ' +
          '<button id="qf-again">Create another version</button></div>';
        q('qf-again').addEventListener('click', function () { create(true); });
        return;
      }
      var html = '<div class="result"><b>Created:</b> ' + esc(r.name) +
        '<br><a href="' + esc(r.pdfUrl) + '" target="_blank">Open PDF</a> · <a href="' + esc(r.sheetUrl) + '" target="_blank">Open sheet</a>';
      if (r.draft) html += '<br>Gmail draft created' + (r.draft.recipient ? ' for ' + esc(r.draft.recipient) : ' (no recipient set)') + '.';
      q('qf-result').innerHTML = html + list(r.warnings, 'warning') + '</div>';
    }

    q('qf-quote').addEventListener('change', loadPreview);
    q('qf-create').addEventListener('click', function () { create(false); });
    google.script.run.withSuccessHandler(function (items) {
      q('qf-quote').innerHTML = items.map(function (i) { return '<option value="' + esc(i.id) + '">' + esc(i.label) + '</option>'; }).join('');
      q('qf-quote').disabled = false;
      if (items.length) loadPreview();
    }).withFailureHandler(fail).getQuoteList();
  })();
</script>
