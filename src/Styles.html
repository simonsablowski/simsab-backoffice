<style>
  body { font-family: Arial, sans-serif; font-size: 13px; color: #202124; margin: 0; padding: 4px 8px; }
  label { display: block; font-weight: bold; margin: 12px 0 4px; }
  select, input[type=text], textarea { width: 100%; box-sizing: border-box; font: inherit; padding: 6px; border: 1px solid #c4c7c5; border-radius: 4px; }
  textarea { min-height: 120px; resize: vertical; }
  .summary { display: grid; grid-template-columns: 140px 1fr; gap: 2px 12px; margin-top: 12px; }
  .summary div:nth-child(odd) { color: #5f6368; }
  ul.msgs { margin: 6px 0; padding-left: 18px; }
  .error { color: #b3261e; }
  .warning { color: #8a5300; }
  .info { color: #3c4043; }
  .hint { color: #5f6368; font-size: 12px; margin-top: 4px; }
  .actions { margin-top: 16px; display: flex; gap: 8px; align-items: center; }
  button { font: inherit; padding: 7px 14px; border-radius: 4px; border: 1px solid #c4c7c5; background: #fff; cursor: pointer; }
  button.primary { background: #0b57d0; color: #fff; border-color: #0b57d0; }
  button:disabled { opacity: 0.5; cursor: default; }
  .result { margin-top: 14px; padding: 10px; background: #e8f0fe; border-radius: 4px; }
  table { border-collapse: collapse; width: 100%; }
  th, td { text-align: left; vertical-align: top; padding: 6px; border-bottom: 1px solid #e0e0e0; }
  .ok { color: #146c2e; }
</style>
